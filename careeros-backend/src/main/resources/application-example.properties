
# ==========================================
# CareerOS - Spring Boot Configuration
# ==========================================

# Application name
spring.application.name=CareerOS

# ==========================================
# Aiven MySQL Database Configuration
# ==========================================

spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
# Hibernate / JPA Configuration
# ==========================================

# Automatically create missing tables and update existing schemas
spring.jpa.hibernate.ddl-auto=update

# Display SQL queries in backend logs
spring.jpa.show-sql=true

# MySQL database dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ==========================================
# Gemini API Configuration
# ==========================================

gemini.api.key=${GEMINI_API_KEY}
