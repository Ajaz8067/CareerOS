<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | CareerOS</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <!-- Left Section -->

            <section class="auth-info">

                <div class="logo">
                    Career<span>OS</span>
                </div>

                <p class="auth-label">
                    START YOUR JOURNEY
                </p>

                <h1>
                    Build a career
                    <span>with direction.</span>
                </h1>

                <p>
                    Create your CareerOS profile and start
                    understanding where you stand and where
                    you should go next.
                </p>

            </section>


            <!-- Register Form -->

            <section class="auth-form">

                <h2>Create your account</h2>

                <p class="form-subtitle">
                    Start building your career profile.
                </p>


                <form id="registerForm">

                    <div class="form-group">

                        <label for="name">
                            Full Name
                        </label>

                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>

                        <small id="nameError" class="error-message"></small>

                    </div>

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input type="email" id="email" name="email" placeholder="Enter your email" required>

                        <small id="emailError" class="error-message"></small>

                    </div>




                    <div class="form-group">

                        <label for="password">
                            Password
                        </label>

                        <input type="password" id="password" name="password" placeholder="Create a password" required>

                        <small id="passwordError" class="error-message"></small>

                        <div class="password-strength">

                            <div class="strength-bar">
                                <div id="strengthProgress"></div>
                            </div>

                            <small id="strengthText"></small>

                        </div>

                    </div>


                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input type="password" id="confirmPassword" name="confirmPassword"
                            placeholder="Confirm your password" required>

                        <small id="confirmPasswordError" class="error-message"></small>

                    </div>
                    <p id="successMessage" class="success-message"></p>

                    <button type="submit" class="auth-button">
                        Create Account
                    </button>


                    <p class="login-link">

                        Already have an account?

                        <a href="login.html">
                            Login
                        </a>

                    </p>

                </form>

            </section>

        </div>

    </main>
    <script src="js/auth.js"></script>

</body>

</html>
